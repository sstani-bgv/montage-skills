<!doctype html>
<html lang="ru" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="./assets/tokens.css" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--paper); }
      body { font-family: var(--font-body); color: var(--ink); }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--paper); }

      /* коралл дизайн-системы даёт 2.8:1 на --paper; текстовый вариант — 3.9:1 */
      :root { --coral-ink: #d94a3e; }

      /* ---------- [0] фоновое пятно ---------- */
      #glowLayer { position: absolute; inset: 0; }
      #glow {
        position: absolute; left: 150px; top: -190px; width: 1620px; height: 1620px;
        background: radial-gradient(circle at 50% 50%,
          rgba(46, 88, 234, 0.20) 0%,
          rgba(46, 88, 234, 0.09) 34%,
          rgba(46, 88, 234, 0) 64%);
      }

      /* ---------- камера (push-in) ---------- */
      #camera { position: absolute; inset: 0; }

      /* ---------- [1] схема «Слои» ---------- */
      #schemaBox { position: absolute; left: 160px; top: 290px; width: 1600px; height: 620px; }
      #schemaMain, #schemaBrace { position: absolute; inset: 0; }
      #schemaBox svg { position: absolute; left: 0; top: 0; width: 1600px; height: 620px; overflow: visible; }

      #srcIcon {
        position: absolute; left: 0; top: 224px; width: 172px; height: 172px;
        border: 2px solid var(--blue); border-radius: 18px;
        background: var(--surface);
        display: flex; flex-direction: column; justify-content: center; gap: 18px; padding: 0 34px;
      }
      #srcIcon i { display: block; height: 2px; background: var(--blue); border-radius: 2px; }
      #srcIcon i:nth-child(1) { width: 100%; }
      #srcIcon i:nth-child(2) { width: 72%; }
      #srcIcon i:nth-child(3) { width: 86%; }
      #srcLabel {
        position: absolute; left: -64px; top: 422px; width: 300px;
        text-align: center; color: var(--blue); font-size: 17px;
      }

      .layer-card {
        position: absolute; left: 320px; width: 800px; height: 152px;
        background: var(--surface); border: 1px solid var(--line-2);
        border-radius: var(--r-xl);
        box-shadow: 0 2px 4px rgba(20, 22, 26, 0.06), 0 16px 40px rgba(20, 22, 26, 0.09);
        display: flex; align-items: center; gap: 34px; padding: 0 40px;
      }
      .layer-card .lc-no { color: var(--muted); width: 124px; flex: none; font-size: 17px; }
      .layer-card .lc-title { font-size: 38px; font-weight: 700; letter-spacing: -0.02em; }

      #braceCaption {
        position: absolute; left: 1262px; top: 262px; width: 300px; color: var(--muted);
        font-size: 28px; line-height: 1.35;
      }

      /* ---------- [2][3] текстовые блоки — обе колонки на ступени H1 (54px) ---------- */
      #left  { position: absolute; left: 160px;  top: 506px; width: 620px; }
      #right { position: absolute; left: 1046px; top: 494px; width: 714px; }
      #leftInner  { line-height: 1.16; }
      #rightInner .r-line {
        font-family: var(--font-body); font-weight: 800; font-size: 54px;
        letter-spacing: -0.025em; line-height: 1.3;
      }
      .w { display: inline-block; }

      /* ---------- [4] chapter-chip ---------- */
      #chip {
        position: absolute; left: 50%; top: 74px; transform: translateX(-50%);
        display: flex; align-items: center; gap: 12px;
        height: 64px; padding: 0 32px;
        border: 1px solid var(--line); border-radius: var(--r-chip);
        background: var(--surface); box-shadow: var(--shadow);
        color: var(--ink);
      }
      #chip .dot { width: 11px; height: 11px; border-radius: 50%; background: var(--blue); flex: none; }
      #chipInner { display: flex; align-items: center; gap: 13px; }
    </style>
  </head>

  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5.2"
         data-width="1920" data-height="1080">

      <!-- [0] фон -->
      <div id="glowLayer" class="clip" data-start="0" data-duration="5.2" data-track-index="0">
        <div id="glow"></div>
      </div>

      <!-- [1] схема-бэкплейт -->
      <div id="camera" class="clip" data-start="0" data-duration="5.2" data-track-index="1">
        <div id="schemaBox" data-layout-ignore>

          <div id="schemaMain">
            <div id="srcIcon"><i></i><i></i><i></i></div>
            <div id="srcLabel" class="t-kicker">CLAUDE.md</div>

            <svg viewBox="0 0 1600 620" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <g fill="none" stroke="#cfd4dc" stroke-width="2" stroke-linecap="round">
                <path d="M 186 310 H 260" />
                <path d="M 260 128 V 492" />
                <path d="M 260 128 H 316" />
                <path d="M 260 310 H 316" />
                <path d="M 260 492 H 316" />
              </g>
            </svg>

            <div class="layer-card grid-paper" style="top: 52px">
              <div class="lc-no t-kicker">Слой 01</div>
              <div class="lc-title">День</div>
            </div>
            <div class="layer-card grid-paper" style="top: 234px">
              <div class="lc-no t-kicker">Слой 02</div>
              <div class="lc-title">Решения</div>
            </div>
            <div class="layer-card grid-paper" style="top: 416px">
              <div class="lc-no t-kicker">Слой 03</div>
              <div class="lc-title">Долгая память</div>
            </div>
          </div>

          <div id="schemaBrace">
            <svg viewBox="0 0 1600 620" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M 1165 52 q 30 0 30 32 v 194 q 0 32 30 32 q -30 0 -30 32 v 194 q 0 32 -30 32"
                    fill="none" stroke="#cfd4dc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <div id="braceCaption">то, что модель<br />держит в голове</div>
          </div>

        </div>
      </div>

      <!-- [2] левая колонка -->
      <div id="left" class="clip" data-start="0.2" data-duration="5" data-track-index="2">
        <div id="leftInner" class="t-h1">
          <span class="w wl">Что</span> <span class="w wl">просто</span>
          <span class="w wl" style="color: var(--coral-ink)">произошло</span>
          <span class="w wl">в</span> <span class="w wl">твоём</span> <span class="w wl">дне.</span>
        </div>
      </div>

      <!-- [3] правая колонка -->
      <div id="right" class="clip" data-start="2.1" data-duration="3.1" data-track-index="3">
        <div id="rightInner">
          <div class="r-line">
            <span class="w wr">Что</span> <span class="w wr">ты</span>
            <span class="w wr">решил</span> <span class="w wr">записать,</span>
          </div>
          <div class="r-line">
            <span class="w wr">чтобы</span> <span class="w wr">не</span> <span class="w wr">забыть.</span>
          </div>
          <div class="r-line">
            <span class="w wr">Это</span> <span class="w wr">и</span> <span class="w wr">есть</span>
            <span class="w wr" style="color: var(--blue)">память.</span>
          </div>
        </div>
      </div>

      <!-- [4] chapter-chip — всегда резкий, без входной анимации -->
      <div id="chip" class="clip" data-start="0" data-duration="5.2" data-track-index="4">
        <div id="chipInner">
          <span class="dot"></span>
          <span style="font-size: 28px; font-weight: 700; letter-spacing: -0.02em">Память Claude</span>
        </div>
      </div>

    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      /* ---- всё время: push-in камеры + дрейф фонового пятна ---- */
      tl.fromTo("#camera", { scale: 1 }, { scale: 1.04, duration: 5.2, ease: "none" }, 0);
      tl.fromTo("#glow", { x: -46, y: 26 }, { x: 46, y: -26, duration: 5.2, ease: "none" }, 0);

      /* ---- 0.2 — первое слово слева И одновременно rack-focus схемы ---- */
      tl.fromTo(".wl",
        { opacity: 0, filter: "blur(8px)", y: 6 },
        { opacity: 1, filter: "blur(0px)", y: 0, duration: 0.35, stagger: 0.15, ease: "power2.out" }, 0.2);

      tl.fromTo("#schemaMain",
        { filter: "blur(0px)", opacity: 1, scale: 1 },
        { filter: "blur(22px)", opacity: 0.34, scale: 1.02, duration: 0.8, ease: "power2.inOut" }, 0.2);

      /* скобка справа гаснет ПОСЛЕДНЕЙ — задержка 0.3 с */
      tl.fromTo("#schemaBrace",
        { filter: "blur(0px)", opacity: 1, scale: 1 },
        { filter: "blur(22px)", opacity: 0.34, scale: 1.02, duration: 0.8, ease: "power2.inOut" }, 0.5);

      /* ---- хендофф колонок: расфокус левой и фокус правой перекрываются 0.25 с ---- */
      tl.to("#leftInner",
        { filter: "blur(10px)", opacity: 0.25, scale: 0.99, duration: 0.5, ease: "power2.inOut" }, 1.85);

      tl.fromTo(".wr",
        { opacity: 0, filter: "blur(8px)", y: 6 },
        { opacity: 1, filter: "blur(0px)", y: 0, duration: 0.35, stagger: 0.15, ease: "power2.out" }, 2.1);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
