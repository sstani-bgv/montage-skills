<script>
const F = (t) => Math.round(t * 30) / 30;
// кадр 0: плашка уже въезжает — видно, что пришла графика
gsap.set("#glass", { opacity: 0.6, y: 44, filter: "blur(4px)" });
tl.to("#glass", { keyframes: [ { opacity: 1, y: 5, filter: "blur(0px)", duration: 0.45, ease: "expo.out" }, { y: 0, duration: 0.7, ease: "none" } ] }, 0);
heroIn("#hero", 0.2);
gsap.set("#t1 .w", { opacity: 0, y: 30, filter: "blur(8px)" });
gsap.set("#t1 .w:first-child", { opacity: 0.5, y: 12, filter: "blur(3px)" });
tl.to("#t1 .w", { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.45, ease: "power3.out", stagger: 0.12 }, 0.02);
rise("#t2 .w", 0.35, 0.1);

// шкала собирается снизу вверх
gsap.set("#rail", { scaleY: 0 });
tl.to("#rail", { scaleY: 1, duration: 0.6, ease: "power2.out" }, 0.4);
gsap.set(".tick", { opacity: 0, scale: 0 });
gsap.set(".lab", { opacity: 0, x: -16 });
const labs = ["#b0", "#b1", "#b2", "#b3", "#b4"];
const ticks = gsap.utils.toArray(".tick").reverse();
ticks.forEach((el, i) => tl.to(el, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(3)" }, 0.45 + i * 0.1));
labs.forEach((s, i) => tl.to(s, { opacity: 1, x: 0, duration: 0.35, ease: "power3.out" }, 0.5 + i * 0.1));

// «если поставим light» — 2.7: маркер встаёт на Light, деление коралловое
gsap.set("#mk", { opacity: 0, scale: 0 });
tl.to("#mk", { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)" }, 2.4);
tl.to("#b0", { color: "#c8322a", duration: 0.25 }, 2.4);

// «мало думать» 4.3 / «не доведёт до конца» 6.5
gsap.set("#cl .w", { opacity: 0, y: 20, filter: "blur(6px)" });
tl.to("#cl .w", { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.45, ease: "power3.out", stagger: 0.13 }, 4.05);

// «экстра хай» 9.3 → «max» 10.1: маркер едет вверх, деления мигают, цвет → синий
tl.to("#cl", { opacity: 0, x: 20, filter: "blur(6px)", duration: 0.35, ease: "power2.in" }, 8.9);
tl.to("#b0", { color: "#61666f", duration: 0.25 }, 8.9);
tl.to("#mk", { y: -147, duration: 0.6, ease: "power3.inOut" }, 8.9);
tl.to("#mk", { backgroundColor: "#2e58ea", duration: 0.6 }, 8.9);
tl.to("#mk", { y: -196, duration: 0.45, ease: "power3.inOut" }, 9.75);
[["#b1", 9.12], ["#b2", 9.3], ["#b3", 9.45]].forEach(([s, t]) => {
  tl.to(s, { keyframes: [ { color: "#2e58ea", scale: 1.08, duration: 0.12 }, { color: "#61666f", scale: 1, duration: 0.25 } ], transformOrigin: "0% 50%" }, t);
});
tl.to("#b4", { color: "#2e58ea", scale: 1.1, transformOrigin: "0% 50%", duration: 0.3, ease: "back.out(3)" }, 10.1);

// «максимально уверенность» 12.2
rise("#cm .w", 11.9, 0.14, 0.45);

// «для простых задач … маленький light» 16.7
rise("#ft .w", 16.45, 0.12, 0.4);

// уход вниз-вправо, не тем же путём
tl.to("#glass", { opacity: 0, x: 40, y: 50, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, 18.55);
</script>
