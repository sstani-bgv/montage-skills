<script>
gsap.set("#cam", { x: 220, scale: 0.9 });
tl.to("#cam", { x: 0, scale: 1, duration: 0.7, ease: "expo.out" }, 0);
gsap.set("#panel", { x: 120, opacity: 0.4 });
tl.to("#panel", { keyframes: [ { x: 10, opacity: 1, duration: 0.45, ease: "expo.out" }, { x: 0, duration: 0.7, ease: "none" } ] }, 0);

// «формат json» 482.8/483.3 → 2.2/2.7: JSON посимвольно, одно слово — единица набора символ
gsap.set("#json", { scale: 1.06, transformOrigin: "0% 50%" });
rise("#json .c", 1.95, 0.1, 0.45);
tl.to("#json", { scale: 1, duration: 0.9, ease: "power2.out" }, 1.95);
// «очень лёгкий формат» 484.4–484.9 → 3.8–4.3
rise("#jsub .w", 3.55, 0.12);

heroIn("#hero", 2.5);

// «просто ключ» 486.2 → 5.6; «и значение» 487.1 → 6.5
chipIn("#ck", 5.35, 24);
chipIn("#cv", 6.2, 24);

// «например ключ… вы сделали какой-то заказ» 488–492 → карточка-код, герой поджимается вверх
gsap.set("#code", { opacity: 0, y: 60 });
tl.to("#code", { keyframes: [ { opacity: 1, y: 6, duration: 0.45, ease: "expo.out" }, { y: 0, duration: 0.7, ease: "none" } ] }, 8.3);
tl.to(["#hero", "#ck", "#cv"], { y: -24, duration: 0.6, ease: "power2.inOut" }, 8.2);

// «вам вернулся ответ» 493.6–494.3 → 13.0–13.7
chipIn("#tag", 12.9, 16);

// печать начинается сразу, как карточка встала («например ключ» 489.1 → 8.5), строка стоит до конца сцены
const parts = [["qk", '{ "quantity": '], ["qv", "3"], ["qe", " }"]];
parts.forEach(([id, txt]) => { const el = document.getElementById(id); txt.split("").forEach((c) => { const sp = document.createElement("span"); sp.className = "ch"; sp.textContent = c; el.appendChild(sp); }); });
const chars = document.querySelectorAll("#qline .ch");
gsap.set(chars, { display: "none" });
gsap.set("#cur", { opacity: 0 });
tl.set("#cur", { opacity: 1 }, 8.5);
chars.forEach((c, i) => tl.set(c, { display: "inline-block" }, Math.round((8.6 + i * 0.05) * 30) / 30));
tl.set("#cur", { opacity: 0 }, 9.6);

// «quantity» 495.1 → 14.5: тройка вспыхивает, под строкой перевод «quantity = количество», держится ≥2 с
tl.to("#qv", { scale: 1.3, duration: 0.18, ease: "power2.out", yoyo: true, repeat: 1, transformOrigin: "50% 60%" }, 13.8);
rise("#eq .w", 13.8, 0.12);
</script>
