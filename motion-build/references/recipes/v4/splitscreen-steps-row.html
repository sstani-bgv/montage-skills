<script>
gsap.set("#scr", { transformOrigin: "0 0", x: -50, y: -70, scale: 1.6 });
tl.to("#scr", { x: 0, y: 0, scale: 1, duration: 0.8, ease: "power3.inOut" }, 0);
gsap.set("#panel", { x: 640 });
tl.to("#panel", { keyframes: [ { x: 10, duration: 0.55, ease: "expo.out" }, { x: 0, duration: 0.6, ease: "none" } ] }, 0.25);
heroIn("#hero", 0.5);
rise("#l1 .w", 0.4, 0.16);

// 1 сказан до сцены · «описание названия» 4.36 · «фильтруем с помощью вот этого» 8.8–10.1 · «фильтруем ещё раз» 14.1
const at = [0.35, 4.05, 9.8, 14.6];
const ids = ["#s1", "#s2", "#s3", "#s4"];
const fr = (t) => Math.round(t * 30) / 30;
ids.forEach((id, i) => {
  chipIn(id, at[i], 30);
  tl.set(`${id} .n`, { backgroundColor: "#2e58ea", borderColor: "#2e58ea" }, fr(at[i]));
  tl.set(`${id} .n b`, { color: "#ffffff" }, fr(at[i]));
  // активный шаг — синее кольцо; держание «дышит» медленно
  tl.to(`${id} .ring`, { opacity: 1, duration: 0.3, ease: "power2.out" }, at[i] + 0.1);
  const end = i < 3 ? at[i + 1] : DUR - 0.6;
  const hold = end - at[i] - 0.4;
  if (hold > 2) tl.to(`${id} .ring`, { opacity: 0.55, duration: hold / 2, ease: "sine.inOut", yoyo: true, repeat: 1 }, at[i] + 0.4);
  if (i < 3) {
    tl.to(`${id} .ring`, { opacity: 0, duration: 0.25 }, at[i + 1]);
    tl.set(`${id} .n`, { backgroundColor: "#ffffff" }, fr(at[i + 1]));
    tl.set(`${id} .n b`, { opacity: 0 }, fr(at[i + 1]));
    tl.set(`${id} .n s`, { opacity: 1 }, fr(at[i + 1]));
  }
});
["#k1", "#k2", "#k3"].forEach((id, i) => {
  gsap.set(id, { scaleX: 0, transformOrigin: "0 50%" });
  tl.to(id, { scaleX: 1, duration: 0.3, ease: "power2.out" }, at[i + 1] - 0.25);
});

// выход: экран разворачивается ровно в полный кадр (поправка на наезд #stage → 1.035)
const S = 1.035, L = 960 - 960 / S, T = 540 - 540 / S;
const tx = DUR - 0.6;
tl.set("#scr", { zIndex: 5 }, Math.round(tx * 30) / 30);  // разворачивающийся экран накрывает панель и ряд
tl.to("#scr", { x: L - 50, y: T - 70, scale: 1.6 / S, borderRadius: 0, duration: 0.6, ease: "power3.inOut" }, tx);
tl.to("#panel", { x: 700, duration: 0.5, ease: "power3.in" }, tx);
tl.to("#row", { y: 330, duration: 0.5, ease: "power3.in" }, tx);
</script>
