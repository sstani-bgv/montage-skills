<style>

<body>
<div id="kin">
<div class="ph" id="p1"><div class="tx">
  <div class="ln a"><span class="w s120">я</span> <span class="w s120">программист —</span></div>

<script>
// ── kinetic-движок: призрак .28 → 1, жёсткий рез, вертикальный push ──
const FPS = 30, fr = (t) => Math.round(t * FPS) / FPS;
tl.to("#kin", { scale: 1.025, duration: DUR, ease: "none" }, 0); // вместе с #stage 1.035 — наезд ~1.06
gsap.set(".ph .w", { opacity: 0, y: 18 });
gsap.set(".emo span", { opacity: 0, scale: 0.4, y: 26 });
gsap.set(".bar", { scaleX: 0 });
// слова по одному: сразу целиком на .28 (3 кадра), потом за 2 кадра на полную — одной фазой с кастомной кривой
const ghostEase = (p) => (p < 0.6 ? 0 : (p - 0.6) / 0.4);
function W(sel, t, step = 0.15) {
  gsap.utils.toArray(sel).forEach((el, i) => {
    const s = fr(t + i * step);
    if (s === 0) { gsap.set(el, { opacity: 0.7, y: 8 }); tl.to(el, { opacity: 1, y: 0, duration: 0.15, ease: "power2.out" }, 0); return; } // кадр 0: слово уже читается
    tl.fromTo(el, { opacity: 0.28 }, { opacity: 1, duration: 0.17, ease: ghostEase, immediateRender: false }, s);
    tl.fromTo(el, { y: 18 }, { y: 0, duration: 0.25, ease: "power3.out", immediateRender: false }, s);
  });
}
function E(sel, t) {
  if (fr(t) === 0) { gsap.set(sel, { opacity: 0.6, scale: 0.8, y: 10 }); tl.to(sel, { opacity: 1, scale: 1, y: 0, duration: 0.3, ease: "back.out(2)" }, 0); return; } tl.to(sel, { opacity: 1, scale: 1, y: 0, duration: 0.4, ease: "back.out(2)" }, fr(t)); }
function cut(sel, t) { tl.set(sel, { autoAlpha: 0 }, fr(t)); }
// push: обе фразы едут одним ходом (одна кривая, один путь) — как рельс; блюр-горб на общем холсте
function push(a, b, t) {
  t = fr(t);
  gsap.set(b, { y: 700 });
  tl.to(a, { y: -700, duration: 0.5, ease: "power3.inOut" }, t);
  tl.to(b, { y: 0, duration: 0.5, ease: "power3.inOut" }, t);
  tl.to("#kin", { keyframes: [{ filter: "blur(10px)", duration: 0.25, ease: "power1.in" }, { filter: "blur(0px)", duration: 0.25, ease: "power1.out" }] }, t);
  tl.set(a, { autoAlpha: 0 }, fr(t + 0.52));
}
function bar(sel, t, d = 0.3) { tl.to(sel, { scaleX: 1, duration: d, ease: "power2.out" }, fr(t)); }
// блок пересобирается по центру, когда дописывается строка
function recenter(sel, dy, t) { gsap.set(sel, { y: dy }); tl.to(sel, { y: 0, duration: 0.4, ease: "power2.inOut" }, fr(t)); }
function shake(sel, t) { tl.to(sel, { keyframes: { x: [0, -16, 14, -10, 6, 0] }, duration: 0.42, ease: "none" }, fr(t)); }

// тайминги — по пословной разметке Groq (абс. = 1027.2 + t), текст на 0.15–0.35 с раньше голоса
W("#p1 .ln.a .w", 0, 0);                                      // программисты 1027.14–1028.86
W("#p1 .ln.b .w", 0.6, 0.18);
cut("#p1", 1.5);
W("#p2 .ln.a .w", 1.5); E("#p2 .emo span", 1.5);             // я когда в Сбербанке работал 1028.86–1030.3
W("#p2 .ln.b .w", 1.9, 0.14);                                 // в Сбербанке 1029.4
cut("#p2", 3.9);
recenter("#t3", 88, 4.85);
E("#p3 .emo span", 3.9);
W("#p3 .ln.a .w", 3.9);                                       // 30 минут 1031.66–1032.06
countUp(document.getElementById("c30"), 0, 30, 3.98, 0.5, (v) => Math.round(v));
W("#p3 .ln.b .w", 4.55, 0.13);                                // в день 1032.06–1032.3
W("#p3 .ln.c .w", 4.9, 0.18);                                 // вместо 8 часов 1032.3–1032.68
bar("#p3 .st .bar", 5.6, 0.28);
cut("#p3", 6.9);
W("#p4 .ln.a .w", 6.9); E("#p4 .emo span", 6.9);             // для работодателя 1033.3–1035.2
W("#p4 .ln.b .w", 8.1);                                       // наоборот кайф 1035.42–1035.58
push("#p4", "#p5", 9.0);
W("#p5 .ln.a .w", 9.05, 0.15);                                // с нейронками 1036.5–1036.9
W("#p5 .ln.b .w", 10.8, 0.2);                                 // самые передовые инструменты 1038.18–1038.78
</script>
