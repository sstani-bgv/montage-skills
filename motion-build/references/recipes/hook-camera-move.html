<!doctype html>
<html lang="ru" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="./assets/tokens.css" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--paper); }
      body { font-family: var(--font-body); color: var(--ink); }

      #root { position: relative; overflow: hidden; background: var(--paper); }

      /* Единая камера: весь контент внутри неё — проезд читается как одно движение */
      .camera { position: absolute; inset: 0; }
      .clip { position: absolute; inset: 0; }
      .par  { position: absolute; inset: 0; }

      /* ---------- [0] фон: миллиметровка + мягкие пятна ---------- */
      .grid {
        position: absolute; inset: 0;
        background-image:
          linear-gradient(rgba(20,22,26,0.055) 2px, transparent 2px),
          linear-gradient(90deg, rgba(20,22,26,0.055) 2px, transparent 2px);
        background-size: 96px 96px;
        -webkit-mask-image: radial-gradient(78% 68% at 50% 52%, #000 0%, rgba(0,0,0,0.55) 52%, rgba(0,0,0,0) 82%);
        mask-image: radial-gradient(78% 68% at 50% 52%, #000 0%, rgba(0,0,0,0.55) 52%, rgba(0,0,0,0) 82%);
      }
      .blob { position: absolute; border-radius: 50%; filter: blur(110px); }
      .blob-a { width: 1520px; height: 1520px; left: -340px; top: -460px;
                background: radial-gradient(circle, rgba(46,88,234,0.17) 0%, rgba(46,88,234,0) 68%); }
      .blob-b { width: 1280px; height: 1280px; right: -300px; bottom: -420px;
                background: radial-gradient(circle, rgba(46,88,234,0.13) 0%, rgba(46,88,234,0) 68%); }
      .vignette { position: absolute; inset: 0;
                  background: radial-gradient(118% 88% at 50% 45%, rgba(255,255,255,0) 52%, rgba(20,22,26,0.07) 100%); }

      /* ---------- [4] вордмарк ---------- */
      .wordmark-row { position: absolute; left: 0; right: 0; top: 280px; display: flex; justify-content: center; }
      .wordmark { font-family: var(--font-body); font-weight: 700; font-size: 30px;
                  letter-spacing: 0.02em; text-transform: uppercase; color: var(--ink);
                  white-space: nowrap; display: inline-block; }
      .lc { display: inline-block; }

      /* ---------- [5] нижний титр (lower-third, нижняя левая зона) ---------- */
      .lt { position: absolute; left: 190px; top: 832px; display: flex; align-items: stretch; gap: 22px; }
      .lt-bar { width: 6px; border-radius: 3px; background: var(--blue); transform-origin: bottom center; }
      .lt-name { font-family: var(--font-body); font-weight: 700; font-size: 36px;
                 letter-spacing: -0.01em; color: var(--ink); white-space: nowrap; }
      .lt-role { margin-top: 10px; font-family: var(--font-body); font-weight: 700; font-size: 15px;
                 letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
      .tw { display: inline-block; }
      .tc { display: inline-block; }

      /* ---------- [1] маркер + [2] тезис ---------- */
      .thesis-row { position: absolute; left: 0; right: 0; top: 384px; }
      .thesis { text-align: center; }
      .thesis .line { display: block; }
      .l-kicker  { font-family: var(--font-body); font-weight: 700; font-size: 38px;
                   line-height: 1.2; letter-spacing: -0.02em; color: var(--muted); }
      .l-hero    { font-family: var(--font-display); font-weight: 700; font-size: 70px;
                   line-height: 1.1; letter-spacing: -0.03em; color: var(--ink); }
      .w { display: inline-block; }
      .mk-wrap { position: relative; }
      .mk { position: absolute; left: -0.08em; right: -0.08em; bottom: 0.06em; height: 0.6em;
            background: var(--mark); border-radius: 4px; z-index: 0; transform-origin: left center; }
      .mk-txt { position: relative; z-index: 1; }

      /* ---------- [3] иконки ---------- */
      .icon { position: absolute; top: 660px; width: 250px; height: 250px; display: block; }
      .icon-l { left: 300px; color: var(--blue); }
      .icon-r { right: 300px; color: var(--blue); }
      .icon svg { width: 100%; height: 100%; display: block; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5"
         data-width="1920" data-height="1080">
      <div class="camera" id="camera">

        <!-- [0] фон -->
        <div class="clip" id="bg" data-start="0" data-duration="5" data-track-index="0">
          <div class="par" id="bg-par">
            <div class="blob blob-a" id="blob-a" data-layout-allow-overflow></div>
            <div class="blob blob-b" id="blob-b" data-layout-allow-overflow></div>
            <div class="grid" id="grid"></div>
            <div class="vignette"></div>
          </div>
        </div>

        <!-- [1]+[2] тезис с маркер-полосой под текстом -->
        <div class="clip" id="thesis" data-start="1.45" data-duration="3.55" data-track-index="2">
          <div class="par" id="thesis-par">
            <div class="thesis-row" id="thesis-dolly">
              <div class="thesis">
                <span class="line l-kicker">
                <span class="w">Внимание</span>
                <span class="w">держит</span>
                </span>
                <span class="line l-hero">
                <span class="w mk-wrap"><span class="mk"></span><span class="mk-txt">движение,</span></span>
                <span class="w">а</span>
                <span class="w">не</span>
                <span class="w">фейды</span>
                </span>
              </div>
            </div>
          </div>
        </div>

        <!-- [3] иконки -->
        <div class="clip" id="icons" data-start="2.3" data-duration="2.7" data-track-index="3">
          <div class="par" id="icons-par">
            <div class="icon icon-l" id="icon-l">
              <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2"
                   stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="24" cy="24" r="19"></circle>
                <circle cx="24" cy="24" r="7"></circle>
                <path d="M24 1.5v6M24 40.5v6M1.5 24h6M40.5 24h6"></path>
              </svg>
            </div>
            <div class="icon icon-r" id="icon-r">
              <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.25"
                   stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M24 3.5 44.5 24 24 44.5 3.5 24Z"></path>
                <path d="M24 15.5 32.5 24 24 32.5 15.5 24Z"></path>
              </svg>
            </div>
          </div>
        </div>

        <!-- [4] вордмарк -->
        <div class="clip" id="wordmark-clip" data-start="0.25" data-duration="4.75" data-track-index="4">
          <div class="par" id="wordmark-par">
            <div class="wordmark-row" id="wordmark-dolly">
              <span class="wordmark" id="wordmark"><span class="lc">Б</span><span class="lc">У</span><span class="lc">Г</span><span class="lc">А</span><span class="lc">Е</span><span class="lc">В</span></span>
            </div>
          </div>
        </div>

        <!-- [5] нижний титр -->
        <div class="clip" id="title-clip" data-start="0.85" data-duration="0.65" data-track-index="5">
          <div class="par" id="title-par">
            <div class="lt" id="title">
              <div class="lt-bar" id="lt-bar"></div>
              <div class="lt-text">
                <div class="lt-name"><span class="tw lt-w"><span class="tc">С</span><span class="tc">т</span><span class="tc">а</span><span class="tc">н</span><span class="tc">и</span><span class="tc">с</span><span class="tc">л</span><span class="tc">а</span><span class="tc">в</span></span> <span class="tw lt-w"><span class="tc">Б</span><span class="tc">у</span><span class="tc">г</span><span class="tc">а</span><span class="tc">е</span><span class="tc">в</span></span></div>
                <div class="lt-role"><span class="tw lt-w"><span class="tc">A</span><span class="tc">I</span></span> <span class="tw lt-w"><span class="tc">·</span></span> <span class="tw lt-w"><span class="tc">п</span><span class="tc">р</span><span class="tc">о</span><span class="tc">д</span><span class="tc">у</span><span class="tc">к</span><span class="tc">т</span><span class="tc">и</span><span class="tc">в</span><span class="tc">н</span><span class="tc">о</span><span class="tc">с</span><span class="tc">т</span><span class="tc">ь</span></span></div>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>

    <script>
      (function () {
        // ---- детерминированная перестановка индексов (LCG, фиксированный сид) ----
        function shuffledIndices(n, seed) {
          var s = seed >>> 0;
          function next() { s = (Math.imul(s, 1664525) + 1013904223) >>> 0; return s / 4294967296; }
          var idx = []; for (var i = 0; i < n; i++) idx.push(i);
          for (var j = n - 1; j > 0; j--) {
            var k = Math.floor(next() * (j + 1));
            var t = idx[j]; idx[j] = idx[k]; idx[k] = t;
          }
          return idx;
        }

        var chars = Array.prototype.slice.call(document.querySelectorAll('#title .tc'));
        var order = shuffledIndices(chars.length, 20260901);

        var LS_STEP = 10.5; // 0.35em при кегле 30px — целевой трекинг марки
        var lcs = Array.prototype.slice.call(document.querySelectorAll('#wordmark .lc'));
        var lcMid = (lcs.length - 1) / 2;

        // ---------- начальные состояния (немедленные, вне таймлайна) ----------
        gsap.set('#camera', { scale: 1, x: 0, y: 0, transformOrigin: '50% 50%' });
        gsap.set('#bg-par', { x: 0, y: 0 });
        gsap.set('#blob-a', { x: 0, y: 0 });
        gsap.set('#blob-b', { x: 0, y: 0 });
        gsap.set('#grid', { x: 0, y: 0 });
        gsap.set('#wordmark-par', { x: 0, y: 0 });
        gsap.set('#wordmark-dolly', { x: 0, y: 0 });
        gsap.set('#wordmark', { scale: 0.4, opacity: 0, transformOrigin: '50% 50%' });
        gsap.set(lcs, { x: 0 });
        gsap.set('#title-par', { x: 0, y: 0 });
        gsap.set('#title .tw', { y: 26, opacity: 0 });
        gsap.set('#lt-bar', { scaleY: 0, opacity: 1 });
        gsap.set(chars, { opacity: 1 });
        gsap.set('#thesis-par', { x: 0, y: 0 });
        gsap.set('#thesis .w', { y: 52, opacity: 0 });
        gsap.set('#thesis .mk', { scaleX: 0, transformOrigin: 'left center' });
        gsap.set('#thesis-dolly', { x: 0, y: 0, scale: 1, transformOrigin: '50% 50%' });
        gsap.set('#icons-par', { x: 0, y: 0 });
        gsap.set('#icon-l', { x: -560, y: 0, scale: 0.6, opacity: 0, filter: 'blur(16px)', transformOrigin: '50% 50%' });
        gsap.set('#icon-r', { x: 560, scale: 0.6, opacity: 0, filter: 'blur(16px)', transformOrigin: '50% 50%' });

        var tl = gsap.timeline({ paused: true });

        // ---------- ОДИН непрерывный проезд камеры (0 → 5 c, ease none) ----------
        tl.to('#camera', { scale: 1.06, x: -18, y: -11, duration: 5, ease: 'none' }, 0);

        // параллакс слоёв: 0.4x / 1x / 1.6x
        tl.to('#bg-par',       { x: -8,  y: 9,   duration: 5, ease: 'none' }, 0);
        tl.to('#blob-a',       { x: 58,  y: 34,  duration: 5, ease: 'none' }, 0);
        tl.to('#blob-b',       { x: -48, y: -28, duration: 5, ease: 'none' }, 0);
        tl.to('#grid',         { x: -14, y: -8,  duration: 5, ease: 'none' }, 0);
        tl.to('#wordmark-par', { x: -9,  y: -13, duration: 5, ease: 'none' }, 0);
        tl.to('#thesis-par',   { x: -22, y: -6,  duration: 3.55, ease: 'none' }, 1.45);
        tl.to('#title-par',    { x: -22, y: -6,  duration: 0.65, ease: 'none' }, 0.85);
        tl.to('#icons-par',    { x: -35, y: 8,   duration: 2.7,  ease: 'none' }, 2.3);

        // ---------- Приём A: раздвижка вордмарка по глифам (0.30–0.95) ----------
        tl.to('#wordmark', { scale: 1, opacity: 1, duration: 0.3, ease: 'power3.out' }, 0.3);
        lcs.forEach(function (el, i) {
          tl.to(el, { x: (i - lcMid) * LS_STEP, duration: 0.35, ease: 'power3.out' }, 0.6);
        });

        // ---------- Нижний титр: сборка пословесно (0.85) ----------
        tl.to('#lt-bar', { scaleY: 1, duration: 0.3, ease: 'power3.out' }, 0.85);
        tl.to('#title .tw', { y: 0, opacity: 1, duration: 0.28, ease: 'power3.out', stagger: 0.038 }, 0.85);

        // ---------- Приём B: детерминированный посимвольный распад (1.25–1.49) ----------
        for (var r = 0; r < order.length; r++) {
          tl.to(chars[order[r]], { opacity: 0, duration: 0.05, ease: 'power1.in' }, 1.25 + r * 0.006);
        }
        tl.to('#lt-bar', { scaleY: 0, duration: 0.14, ease: 'power2.in' }, 1.38);

        // ---------- Тезис: пословесный rise (1.45) ----------
        tl.to('#thesis .w', { y: 0, opacity: 1, duration: 0.42, ease: 'power3.out', stagger: 0.035 }, 1.45);

        // ---------- Приём C: marker wipe за ключевым словом (1.70–2.10) ----------
        tl.to('#thesis .mk', { scaleX: 1, duration: 0.4, ease: 'power2.inOut' }, 1.7);

        // ---------- Симметричный прилёт иконок из-за кромки (2.30) ----------
        tl.to('#icon-l', { x: 0, scale: 1, opacity: 1, filter: 'blur(0px)', duration: 0.5, ease: 'back.out(1.4)' }, 2.3);
        tl.to('#icon-r', { x: 0, scale: 1, opacity: 1, filter: 'blur(0px)', duration: 0.5, ease: 'back.out(1.4)' }, 2.3);

        // ---------- Камерный dolly в асимметричную финальную композицию (3.20–4.30) ----------
        tl.to('#icon-l',      { x: -80, y: 0, scale: 1.55, duration: 1.1, ease: 'power3.inOut' }, 3.2);
        tl.to('#icon-r',      { x: 700, scale: 0.86, opacity: 0, duration: 1.1, ease: 'power3.inOut' }, 3.2);
        tl.to('#thesis-dolly',{ x: 300, y: -60, scale: 0.96, duration: 1.1, ease: 'power3.inOut' }, 3.2);
        tl.to('#wordmark-dolly',{ x: 300, y: -70, duration: 1.1, ease: 'power3.inOut' }, 3.2);

        // 4.30–5.00 — держим финальную композицию (камера продолжает проезд)

        window.__timelines = window.__timelines || {};
        window.__timelines['main'] = tl;
      })();
    </script>
  </body>
</html>
